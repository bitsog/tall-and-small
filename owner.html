<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>David's Review Dashboard</title><style>body{font:16px/1.5 system-ui;background:#fff5d9;color:#103c29;margin:0}main{max-width:650px;margin:auto;padding:24px}section{background:#fff;border-radius:12px;padding:18px;margin:16px 0}input,textarea,button{font:inherit;max-width:100%;padding:10px;border-radius:7px}textarea{width:100%;min-height:90px}button{background:#103c29;color:#fff;border:0;cursor:pointer}.entry{border-bottom:1px solid #bbb;padding:14px 0}.star{color:#bc8400;font-size:20px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="owner-settings.js"></script></head><body><main><h1>David's review dashboard</h1><p>Private management page. Only the designated owner account can publish responses or hide abusive reviews.</p><section id="login"><h2>Sign in</h2><p>Enter your authorized email to receive a sign-in link.</p><input id="email" type="email" placeholder="Email address"><button id="send">Send sign-in link</button><p id="message"></p></section><section id="dashboard" hidden><button id="logout">Sign out</button><h2>Customer reviews</h2><div id="list"></div></section></main><script>
(async()=>{
const c=window.TALL_SMALL_OWNER||{};const msg=document.getElementById('message'),dash=document.getElementById('dashboard'),login=document.getElementById('login');
if(!c.supabaseUrl||!c.anonKey||!c.apiUrl){msg.textContent='Owner dashboard setup is incomplete.';return}
const client=supabase.createClient(c.supabaseUrl,c.anonKey);let session;
async function load(){let s=await client.auth.getSession();session=s.data.session;login.hidden=!!session;dash.hidden=!session;if(!session)return;const res=await fetch(c.apiUrl);if(!res.ok){document.getElementById('list').textContent='Unable to load reviews';return}const j=await res.json();const root=document.getElementById('list');root.replaceChildren();for(const r of j.reviews||[]){const d=document.createElement('div');d.className='entry';const title=document.createElement('strong');title.textContent=r.name+' — '+r.rating+'/5 stars';const review=document.createElement('p');review.textContent=r.comment;const label=document.createElement('label');label.textContent='David’s public reply';const area=document.createElement('textarea');area.value=r.owner_reply||'';const save=document.createElement('button');save.textContent='Publish reply';save.onclick=async()=>{const z=await fetch(c.apiUrl,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({id:r.id,owner_reply:area.value})});alert(z.ok?'Reply saved':'Could not save response')};const hide=document.createElement('button');hide.textContent='Hide abusive review';hide.style.marginLeft='8px';hide.onclick=async()=>{if(!confirm('Hide this review from the website?'))return;const z=await fetch(c.apiUrl,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({id:r.id,status:'hidden'})});if(z.ok)load();else alert('Could not hide review')};d.append(title,review,label,area,save,hide);root.append(d)}}}
document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email)return;const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});msg.textContent=error?'Unable to send login link':'Check your email for a sign-in link.'};
document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.reload()};
client.auth.onAuthStateChange(()=>setTimeout(load,0));await load();
})();
</script></body></html>
